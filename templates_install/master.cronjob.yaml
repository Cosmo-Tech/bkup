apiVersion: batch/v1
kind: CronJob
metadata:
  name: bkup-master
  namespace: ${NAMESPACE}
spec:
  schedule: "${CRON}"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: bkup
          restartPolicy: Never
          containers:
            - name: bkup-master
              image: ghcr.io/cosmo-tech/bkup:latest
              imagePullPolicy: Always
              env:
                - name: CLUSTER_NAME
                  valueFrom:
                    secretKeyRef:
                      name: bkup-config
                      key: cluster-name
                      optional: false
                - name: NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
          imagePullSecrets:
            - name: registry-auth-bkup
 