apiVersion: batch/v1
kind: CronJob
metadata:
  name: bkup-master
  namespace: ${NAMESPACE}
spec:
  schedule: "${CRON}"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: bkup
          restartPolicy: Never
          containers:
            - name: bkup-master
              image: ghcr.io/cosmo-tech/bkup:latest
              imagePullPolicy: Always
              env:
                - name: CLUSTER_NAME
                  value: ${CLUSTER_NAME}
                - name: NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: INSTALLATION_NAME
                  value: bkup
                - name: WORKER_VALUES
                  value: |
                    resources:
                      requests:
                        cpu: 100m
                        memory: 128Mi
                        ephemeral-storage: 50Mi
                      limits:
                        cpu: 1000m
                        memory: 512Mi
                        ephemeral-storage: 2Gi
          imagePullSecrets:
            - name: registry-auth-bkup
 