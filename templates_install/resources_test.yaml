apiVersion: v1
kind: Pod
metadata:
  name: clustersnap-master
  namespace: ${NAMESPACE}
spec:
  containers:
    - name: clustersnap-master
      image: ghcr.io/cosmo-tech/clustersnap:latest
      imagePullPolicy: Always
      env:
        - name: CLUSTER_NAME
          valueFrom:
            secretKeyRef:
              name: clustersnap-config
              key: cluster-name
              optional: false
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
  imagePullSecrets:
    - name: registry-auth-clustersnap
  serviceAccountName: clustersnap

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: clustersnap
  namespace: ${NAMESPACE}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: clustersnap
rules:
  # Core resources
  - apiGroups: [""]
    resources:
      - "persistentvolumeclaims"
      - "persistentvolumes"
      - "pods"
      - "namespaces"
      - "services"
    verbs: ["get", "list", "watch"]

  - apiGroups: [""]
    resources:
      - "configmaps"
    verbs: ["get", "list", "watch", "create", "update", "patch"]

  - apiGroups: [""]
    resources:
      - "secrets"
    verbs: ["get", "list", "watch"]

  - apiGroups: ["apps"]
    resources:
      - "statefulsets"
      - "deployments"
    verbs: ["get", "list", "watch", "patch", "update"]

  - apiGroups: ["batch"]
    resources:
      - "jobs"
      - "jobs/status"
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  - apiGroups: ["storage.k8s.io"]
    resources:
      - "volumeattachments"
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: clustersnap-pvc-binding
subjects:
  - kind: ServiceAccount
    name: clustersnap
    namespace: ${NAMESPACE}
roleRef:
  kind: ClusterRole
  name: clustersnap
  apiGroup: rbac.authorization.k8s.io