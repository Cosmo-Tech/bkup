apiVersion: v1
kind: Pod
metadata:
  name: bkup-master
  namespace: ${NAMESPACE}
spec:
  restartPolicy: Never
  containers:
    - name: bkup-master
      image: ghcr.io/cosmo-tech/bkup:latest
      imagePullPolicy: Always
      env:
        - name: CLUSTER_NAME
          valueFrom:
            secretKeyRef:
              name: bkup-config
              key: cluster-name
              optional: false
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
  imagePullSecrets:
    - name: registry-auth-bkup
  serviceAccountName: bkup
