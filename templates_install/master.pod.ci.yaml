apiVersion: v1
kind: Pod
metadata:
  name: bkup-master
  namespace: ${NAMESPACE}
spec:
  restartPolicy: Never
  containers:
    - name: bkup-master
      image: ghcr.io/cosmo-tech/bkup:ci
      imagePullPolicy: Always
      env:
        - name: CLUSTER_NAME
          value: ${CLUSTER_NAME}
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: INSTALLATION_NAME
          value: bkup
        - name: WORKER_VALUES
          value: |
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
                ephemeral-storage: 50Mi
              limits:
                cpu: 1000m
                memory: 512Mi
                ephemeral-storage: 2Gi
    - name: registry-auth-bkup
  serviceAccountName: bkup
