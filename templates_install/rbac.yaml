apiVersion: v1
kind: ServiceAccount
metadata:
  name: bkup
  namespace: ${NAMESPACE}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bkup
rules:
  # Core resources
  - apiGroups: [""]
    resources:
      - "persistentvolumeclaims"
      - "persistentvolumes"
      - "pods"
      - "namespaces"
      - "services"
      - "nodes"
    verbs: ["get", "list", "watch"]

  - apiGroups: [""]
    resources:
      - "configmaps"
    verbs: ["get", "list", "watch", "create", "update", "patch"]

  - apiGroups: [""]
    resources:
      - "secrets"
    verbs: ["get", "list", "watch"]

  - apiGroups: ["apps"]
    resources:
      - "statefulsets"
      - "deployments"
    verbs: ["get", "list", "watch", "patch", "update"]

  - apiGroups: ["batch"]
    resources:
      - "jobs"
      - "jobs/status"
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  - apiGroups: ["storage.k8s.io"]
    resources:
      - "volumeattachments"
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bkup-pvc-binding
subjects:
  - kind: ServiceAccount
    name: bkup
    namespace: ${NAMESPACE}
roleRef:
  kind: ClusterRole
  name: bkup
  apiGroup: rbac.authorization.k8s.io