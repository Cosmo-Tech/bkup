name: Unit Tests
run-name: "[unit-tests] ${{ github.ref_name }} / ${{ github.event.head_commit.message }} #${{ github.sha }}"

on:
  push:
    branches:
      - '**'

jobs:
  test:
    name: Run Pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-mock

      - name: Run Pytest
        env:
          PYTHONPATH: .
        run: pytest tests/ -v