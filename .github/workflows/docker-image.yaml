name: Build and push Docker image
run-name: "[image] ${{ github.event.head_commit.message }}"

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches:
      - main
      - ci*
      - cd*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PRIVATE_REGISTRY:   ${{ vars.HARBOR_REGISTRY_URL }}
  PRIVATE_REPOSITORY: ${{ vars.HARBOR_REGISTRY_REPO }}
  PRIVATE_USERNAME:   ${{ secrets.HARBOR_ROBOT_ACCOUNT_NAME }}
  PRIVATE_PASSWORD:   ${{ secrets.HARBOR_ROBOT_ACCOUNT_SECRET }}

  PUBLIC_REGISTRY:    ghcr.io
  PUBLIC_REPOSITORY:  ${{ github.repository }}
  PUBLIC_USERNAME:    ${{ github.actor }}
  PUBLIC_PASSWORD:    ${{ secrets.GITHUB_TOKEN }}

jobs:
  private-registry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.PRIVATE_REGISTRY }}/${{ env.PRIVATE_REPOSITORY }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Login registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.PRIVATE_REGISTRY }}
          username: ${{ env.PRIVATE_USERNAME }}
          password: ${{ env.PRIVATE_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}


  public-registry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.PUBLIC_REGISTRY }}/${{ env.PUBLIC_REPOSITORY }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Login registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.PUBLIC_REGISTRY }}
          username: ${{ env.PUBLIC_USERNAME }}
          password: ${{ env.PUBLIC_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
