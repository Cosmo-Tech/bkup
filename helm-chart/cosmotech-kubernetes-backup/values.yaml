# Override the chart name
nameOverride: ""
fullnameOverride: ""

# Customize workload
workload:
  nodeSelector: {}
  tolerations: []
  affinity: {}
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
      ephemeral-storage: 50Mi
    limits:
      cpu: 100m
      memory: 128Mi
      ephemeral-storage: 2Gi
  image:
    repository: ghcr.io/cosmo-tech/bkup
    pullPolicy: IfNotPresent
    tag: "latest"
    pullSecrets: []


# Backup jobs behaviors
backup:
  # Cron expression to specify when to run the jobs
  cron: ""
  # Cron timeZone
  timeZone: "Europe/Paris"
  # Number of successful jobs to keep in history
  successfulJobsHistoryLimit: 10
  # Number of failed jobs to keep in history
  failedJobsHistoryLimit: 10

  # Remote destination where to send backups
  # e.g:  
  # destination:
  #   address: azure://bucket/blob
  #   username: myuser
  #   passwordSecret:
  #     - name: mysecret
  #     - key: password
  #   container: mycontainer
  destination:
    address: ""
    username: ""
    passwordSecret:
      name: mysecret
      key: password
    container: ""

  # Configure the job backup type for PostgreSQL
  # e.g:  
  # - address: postgresql.namespace.svc.cluster.local
  #   port: 5432
  #   database: postgres
  #   username: postgres
  #   passwordSecret:
  #     - name: mysecret
  #     - key: postgres-password
  #   image: "myregistry/postgresql:tag"
  postgresql:
    - address: postgresql.namespace.svc.cluster.local
      port: 5432
      database: postgres
      username: postgres
      # Secret where to find the password to connect to PostgreSQL (clear password is not allowed in this values file)
      passwordSecret:
        name: mysecret
        key: password
      # Docker image to use as PostgreSQL client
      image: "myregistry/postgresql:tag"

  # Configure the job backup type for volumes
  # e.g:
  # volume:
  #   namespaces:
  #     - namespace1
  #     - namespace2
  #     - namespace3
  volume:
    # Target specific namespaces to backup (if empty, all namespaces will be targetted)
    namespaces: []