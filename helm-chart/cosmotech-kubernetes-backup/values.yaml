# Override the chart name
nameOverride: ""
fullnameOverride: ""

# Customize workload
# e.g:
# workload:
#   nodeSelector: {}
#   tolerations: []
#   affinity: {}
#   podSecurityContext:
#     runAsNonRoot: true
#     runAsUser: 65532
#     runAsGroup: 65532
#     fsGroup: 65532
#   securityContext:
#     runAsNonRoot: true
#     runAsUser: 65532
#     runAsGroup: 65532
#     allowPrivilegeEscalation: false
#     readOnlyRootFilesystem: true
#     capabilities:
#       drop:
#         - ALL
#   resources:
#     requests:
#       cpu: 100m
#       memory: 128Mi
#       ephemeral-storage: 50Mi
#     limits:
#       cpu: 100m
#       memory: 128Mi
#       ephemeral-storage: 2Gi
#   image:
#     repository: ghcr.io/cosmo-tech/bkup
#     tag: "latest"
#     pullSecrets:
#       - name: mysecret
#     pullPolicy: IfNotPresent
workload:
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
      ephemeral-storage: 50Mi
    limits:
      cpu: 100m
      memory: 128Mi
      ephemeral-storage: 2Gi
  image:
    repository: ghcr.io/cosmo-tech/bkup
    tag: "latest"
    pullSecrets: []
    pullPolicy: ""

# Backup jobs behaviors
backup:
  # Cron expression to specify when to run the jobs
  # e.g:
  # cron: 00 23 * * 1-5   # => monday-friday at 23pm
  cron: ""
  # Cron timeZone
  # e.g:
  # timeZone: "Europe/Paris"
  timeZone: "Europe/Paris"
  # Number of successful jobs to keep in history
  successfulJobsHistoryLimit: 10
  # Number of failed jobs to keep in history
  failedJobsHistoryLimit: 10

  # Remote destination where to send backups
  # e.g:  
  # destination:
  #   protocol: "s3"
  #   endpoint: "mys3.example.com"
  #   root: "mycontainer"
  #   username: myuser
  #   passwordSecret:
  #       name: mysecret
  #       key: password
  destination:
    # Fsspec known protocols: s3, abfs (azure), gcs, sftp, webdav, file, etc... (https://filesystem-spec.readthedocs.io/en/latest/api.html#fsspec.available_protocols)
    protocol: ""
    # Optional FQDN or IP in case of self-hosted s3
    endpoint: ""
    # Root path of the remote storage (container)
    root: ""
    username: ""
    passwordSecret:
      name: ""
      key: ""

  # Configure the job backup type for PostgreSQL
  # e.g:
  # - address: postgresql.namespace.svc.cluster.local
  #   port: 5432
  #   database: postgres
  #   username: postgres
  #   passwordSecret:
  #       name: mysecret
  #       key: postgres-password
  #   image:
  #     repository: myregistry/postgresql
  #     pullPolicy: IfNotPresent
  #     tag: "latest"
  #     pullSecrets:
  #       - name: mysecret
  #   namespace: default
  postgresql:
    - address: ""
      port: 5432
      database: ""
      username: ""
      # Secret where to find the password to connect to PostgreSQL (clear password is not allowed in this values file)
      passwordSecret:
        name: ""
        key: ""
      # Image to use as PostgreSQL client
      image:
        repository: ""
        tag: ""
        pullSecrets: []
        pullPolicy: ""
      # Namespace where to run the Kubernetes job
      namespace: ""
      # Per-instance pre/post hooks (generic Kubernetes resource patches)
      hooks:
        # e.g:
        # Hooks are designed to edit anything on resources before or after running the backups.
        # For example it's useful to ensure a pod PostgreSQL pod is well-running (bkup jobs requires PostgreSQL to be available to use pg_dump)
        # Example of pre & post hooks to save a Cloudnative-PG hibernation annotation, patch it & restore it (an autostop may have been setuped...)
        # pre:
        #   - action: copy_manifest_part
        #     apiVersion: postgresql.cnpg.io/v1
        #     kind: Cluster
        #     namespace: mynamespace
        #     name: mynamespace-postgresql
        #     sourcePath: [metadata, annotations, cnpg.io/hibernation]
        #     targetPath: [metadata, annotations, bkup/original-cnpg-hibernation]
        #   - action: patch
        #     apiVersion: postgresql.cnpg.io/v1
        #     kind: Cluster
        #     namespace: mynamespace
        #     name: mynamespace-postgresql
        #     patch:
        #       metadata:
        #         annotations:
        #           cnpg.io/hibernation: "off"
        #     waitSeconds: 20
        pre: []
        # e.g:
        # post:
        #   - action: copy_manifest_part
        #     apiVersion: postgresql.cnpg.io/v1
        #     kind: Cluster
        #     namespace: mynamespace
        #     name: mynamespace-postgresql
        #     sourcePath: [metadata, annotations, bkup/original-cnpg-hibernation]
        #     targetPath: [metadata, annotations, cnpg.io/hibernation]
        post: []

  # Configure the job backup type for volumes
  # e.g:
  # volume:
  #   namespaces:
  #     - namespace1
  #     - namespace2
  #     - namespace3
  volume:
    # Target specific namespaces to backup (if empty, all namespaces will be targetted)
    namespaces: []

  # Global pre/post hooks (generic Kubernetes resource patches)
  hooks:
    # e.g:
    # pre:
    #   - apiVersion: apps/v1
    #     kind: Deployment
    #     namespace: cnpg-system
    #     name: cnpg-cloudnative-pg
    #     patch:
    #       spec:
    #         replicas: 1
    pre: []
    # e.g:
    # post:
    #   - apiVersion: apps/v1
    #     kind: Deployment
    #     namespace: cnpg-system
    #     name: cnpg-cloudnative-pg
    #     patch:
    #       spec:
    #         replicas: 0
    post: []

rbac:
  # Optional extra RBAC rules required by custom hooks
  extraRules: []
  # e.g:
  # - apiGroups: ["postgresql.cnpg.io"]
  #   resources: ["clusters"]
  #   verbs: ["get", "list", "patch"]
