# Override the chart name
nameOverride: ""
fullnameOverride: ""

# Required cluster name
clusterName: ""

# Customize workload of operator
operator:
  nodeSelector: {}
  tolerations: []
  affinity: {}
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
      ephemeral-storage: 50Mi
    limits:
      cpu: 100m
      memory: 128Mi
      ephemeral-storage: 2Gi
  image:
    repository: ghcr.io/cosmo-tech/bkup
    pullPolicy: IfNotPresent
    tag: "latest"
    pullSecrets: []

# Customize workload of workers
worker:
  # Note: there is no nodeSelector here as it's part of bkup to determine the right node where to launch the workers
  tolerations: []
  affinity: {}
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
      ephemeral-storage: 50Mi
    limits:
      cpu: 1000m
      memory: 512Mi
      ephemeral-storage: 2Gi
  image:
    repository: ghcr.io/cosmo-tech/bkup
    pullPolicy: IfNotPresent
    tag: "latest"
    pullSecrets: []


# Backup jobs behaviors
backup:
  # Cron expression to specify when to run the jobs
  cron: ""
  # Number of successful jobs to keep in history
  successfulJobsHistoryLimit: 10
  # Number of failed jobs to keep in history
  failedJobsHistoryLimit: 10
  # Remote destination where to send backups
  # Based on https://github.com/piskvorky/smart_open
  # e.g:  
  # destination:
  #   address: azure://bucket/blob
  #   username: myuser
  #   passwordSecret:
  #     - name: mysecret
  #     - key: password
  destination:
    address:
    username:
    passwordSecret:
      - name: mysecret
      - key: password
  # List of PostgreSQL to backup
  # e.g:  
  # - address: postgresql.namespace.svc.cluster.local
  #   port: 5432
  #   database: postgres
  #   username: postgres
  #   passwordSecret:
  #     - name: mysecret
  #     - key: postgres-password
  #   image: "myregistry/postgresql:tag"
  postgresql:
    - address: postgresql.namespace.svc.cluster.local
      port: 5432
      database: postgres
      username: postgres
      # Secret where to find the password to connect to PostgreSQL (clear password is not allowed in this values file)
      passwordSecret:
        - name: mysecret
        - key: password
      # Docker image to use as PostgreSQL client
      image: "myregistry/postgresql:tag"
