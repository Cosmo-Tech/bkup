apiVersion: v1
kind: Pod
metadata:
  name: clustersnap
  namespace: ${NAMESPACE}
spec:
  containers:
    - name: clustersnap
      image: ghcr.io/cosmo-tech/clustersnap:latest
      imagePullPolicy: Always
  imagePullSecrets:
    - name: registry-auth-clustersnap
  serviceAccountName: clustersnap

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: clustersnap
  namespace: ${NAMESPACE}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: clustersnap-pvc-reader
rules:
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: clustersnap-pvc-binding
subjects:
  - kind: ServiceAccount
    name: clustersnap
    namespace: ${NAMESPACE}
roleRef:
  kind: ClusterRole
  name: clustersnap-pvc-reader
  apiGroup: rbac.authorization.k8s.io