apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ JOB_NAME }}"
  namespace: "{{ JOB_NAMESPACE }}"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 86400
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets: {{ BKUP_IMAGE_PULL_SECRETS | tojson }}
      securityContext: {{ BKUP_POD_SECURITY_CONTEXT | tojson }}
      containers:
        - name: importer
          image: "{{ BKUP_IMAGE_REPOSITORY }}:{{ BKUP_IMAGE_TAG }}"
          imagePullPolicy: "{{ BKUP_IMAGE_PULL_POLICY }}"
          securityContext: {{ BKUP_SECURITY_CONTEXT | tojson }}
          command: ["python", "-m", "src.importer"]
          resources:
            requests:
              cpu: "250m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          volumeMounts:
            - name: volume-to-import
              mountPath: "{{ MOUNT_PATH }}"
              readOnly: false
            - name: tmp
              mountPath: /tmp
          env:
            - name: BKUP_STORAGE_PROTOCOL
              value: "{{ STORAGE_PROTOCOL }}"
            - name: BKUP_STORAGE_ENDPOINT
              value: "{{ STORAGE_ENDPOINT }}"
            - name: BKUP_STORAGE_ROOT
              value: "{{ STORAGE_ROOT }}"
            - name: BKUP_STORAGE_USERNAME
              value: "{{ STORAGE_USERNAME }}"
            - name: BKUP_STORAGE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "{{ STORAGE_PASSWORD_SECRET_NAME }}"
                  key: "{{ STORAGE_PASSWORD_SECRET_KEY }}"
            - name: BKUP_ARCHIVE_NAME
              value: "{{ ARCHIVE_NAME }}"
            - name: BKUP_MOUNT_PATH
              value: "{{ MOUNT_PATH }}"
            - name: BKUP_JOB_NAMESPACE
              value: "{{ JOB_NAMESPACE }}"

      volumes:
        - name: volume-to-import
          persistentVolumeClaim:
            claimName: "{{ PVC_NAME }}"
        - name: tmp
          emptyDir: {}
