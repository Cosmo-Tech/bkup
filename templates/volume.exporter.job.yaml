apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ JOB_NAME }}"
  namespace: "{{ NAMESPACE }}"
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - "{{ NODE_NAME }}"
      containers:
        - name: backup-worker-volume
          image: ghcr.io/cosmo-tech/clustersnap:latest
          imagePullPolicy: Always
          command: ["python", "-m", "src.exporter"]
          args: ["--pvc", "{{ PVC_NAME }}", "--path", "{{ MOUNTED_PATH }}"]
          resources:
            requests:
              cpu: "250m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          volumeMounts:
            - name: volume-to-backup
              mountPath: "{{ MOUNTED_PATH }}"
              readOnly: true
          env:
            - name: STORAGE_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: clustersnap-config
                  key: storage-address
            - name: STORAGE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: clustersnap-config
                  key: storage-username
            - name: STORAGE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clustersnap-config
                  key: storage-password
            - name: CLUSTER_NAME
              valueFrom:
                secretKeyRef:
                  name: clustersnap-config
                  key: cluster-name
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
      volumes:
        - name: volume-to-backup
          persistentVolumeClaim:
            claimName: "{{ PVC_NAME }}"