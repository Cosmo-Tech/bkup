apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ JOB_NAME }}"
  namespace: "{{ NAMESPACE }}"
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: worker
          image: {{ IMAGE }}
          imagePullPolicy: {{ IMAGE_PULL_POLICY }}
          # command: ["python", "-m", "src.exporter"]
          # args: ["--pvc", "{{ PVC_NAME }}", "--path", "{{ MOUNT_PATH }}", "--type", "volume"]
          command: ["python", "-m", "src.exporter"]
          # command: ["env"]
          resources:
            requests:
              cpu: "250m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          volumeMounts:
            - name: volume-to-backup
              mountPath: "{{ MOUNT_PATH }}"
              readOnly: true
          env:
            - name: BKUP_STORAGE_PROTOCOL
              value: {{ STORAGE_PROTOCOL }}
            - name: BKUP_STORAGE_ENDPOINT
              value: {{ STORAGE_ENDPOINT }}
            - name: BKUP_STORAGE_ROOT
              value: {{ STORAGE_ROOT }}
            - name: BKUP_STORAGE_USERNAME
              value: {{ STORAGE_USERNAME }}
            - name: BKUP_STORAGE_PASSWORD
              value: {{ STORAGE_PASSWORD }}
            - name: BKUP_ARCHIVE_NAME
              value: {{ ARCHIVE_NAME }}
            - name: BKUP_MOUNT_PATH
              value: {{ MOUNT_PATH }}

      volumes:
        - name: volume-to-backup
          persistentVolumeClaim:
            claimName: "{{ PVC_NAME }}"