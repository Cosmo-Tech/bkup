apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ JOB_NAME }}"
  namespace: "{{ NAMESPACE }}"
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: worker
          image: {{ IMAGE }}
          imagePullPolicy: {{ IMAGE_PULL_POLICY }}
          # command: ["python", "-m", "src.exporter"]
          # args: ["--pvc", "{{ PVC_NAME }}", "--path", "{{ MOUNTED_PATH }}", "--type", "volume"]
          # command: ["python", "-m", "src.operator"]
          command: ["echo", "test"]
          resources:
            requests:
              cpu: "250m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          volumeMounts:
            - name: volume-to-backup
              mountPath: "{{ MOUNTED_PATH }}"
              readOnly: true
          env:
            - name: STORAGE_ADDRESS
              value: {{ STORAGE_ADDRESS }}
            - name: STORAGE_USERNAME
              value: {{ STORAGE_USERNAME }}
            - name: STORAGE_PASSWORD
              value: {{ STORAGE_PASSWORD }}
            - name: STORAGE_CONTAINER
              value: {{ STORAGE_CONTAINER }}

      volumes:
        - name: volume-to-backup
          persistentVolumeClaim:
            claimName: "{{ PVC_NAME }}"