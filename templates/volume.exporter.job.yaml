apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ JOB_NAME }}"
  namespace: "{{ JOB_NAMESPACE }}"
  # labels:
  #   bkup: job
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 86400
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets: {{ BKUP_IMAGE_PULL_SECRETS | tojson }}
      containers:
        - name: exporter
          image: "{{ BKUP_IMAGE_REPOSITORY }}:{{ BKUP_IMAGE_TAG }}"
          imagePullPolicy: "{{ BKUP_IMAGE_PULL_POLICY }}"
          command: ["python", "-m", "src.exporter"]
          resources:
            requests:
              cpu: "250m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          volumeMounts:
            - name: volume-to-export
              mountPath: "{{ MOUNT_PATH }}"
              readOnly: true
          env:
            - name: BKUP_STORAGE_PROTOCOL
              value: "{{ STORAGE_PROTOCOL }}"
            - name: BKUP_STORAGE_ENDPOINT
              value: "{{ STORAGE_ENDPOINT }}"
            - name: BKUP_STORAGE_ROOT
              value: "{{ STORAGE_ROOT }}"
            - name: BKUP_STORAGE_USERNAME
              value: "{{ STORAGE_USERNAME }}"
            # - name: BKUP_STORAGE_PASSWORD
            #   value: "{{ STORAGE_PASSWORD }}"
            - name: BKUP_STORAGE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "{{ STORAGE_PASSWORD_SECRET_NAME }}"
                  key: "{{ STORAGE_PASSWORD_SECRET_KEY }}"
            # - name: BKUP_STORAGE_PASSWORD_SECRET_NAME
            #   value: "{{ STORAGE_PASSWORD_SECRET_NAME }}"
            # - name: BKUP_STORAGE_PASSWORD_SECRET_KEY
            #   value: "{{ STORAGE_PASSWORD_SECRET_KEY }}"
            - name: BKUP_ARCHIVE_NAME
              value: "{{ ARCHIVE_NAME }}"
            - name: BKUP_MOUNT_PATH
              value: "{{ MOUNT_PATH }}"
            - name: BKUP_JOB_NAMESPACE
              value: "{{ JOB_NAMESPACE }}"

      volumes:
        - name: volume-to-export
          persistentVolumeClaim:
            claimName: "{{ PVC_NAME }}"
