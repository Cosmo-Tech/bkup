apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ JOB_NAME }}"
  namespace: "{{ NAMESPACE }}"
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: backup-worker
          image: ghcr.io/cosmo-tech/clustersnap:latest
          imagePullPolicy: Always
          command: ["python", "-m", "src.worker"]
          args: ["--pvc", "{{ PVC_NAME }}", "--path", "{{ MOUNTED_PATH }}"]
          resources:
            requests:
              cpu: "250m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          volumeMounts:
            - name: volume-to-backup
              mountPath: "{{ MOUNTED_PATH }}"
              readOnly: true
          env:
            - name: STORAGE_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: clustersnap-config
                  key: storage-address
                  optional: false
            - name: STORAGE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: clustersnap-config
                  key: storage-username
                  optional: false
            - name: STORAGE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clustersnap-config
                  key: storage-password
                  optional: false
      volumes:
        - name: volume-to-backup
          persistentVolumeClaim:
            claimName: "{{ PVC_NAME }}"