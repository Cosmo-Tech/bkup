apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ JOB_NAME }}"
  namespace: "{{ NAMESPACE }}"
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
        # --- MAIN CONTAINER: Clustersnap core tool with native Python environment ---
        - name: postgres-backup-worker
          image: ghcr.io/cosmo-tech/clustersnap:latest
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              # This script waits for a UNIX pipe from the sidecar container to get the right PostgreSQL binaries
              pipe='/shared/pg_pipe'
              ready_flag='/shared/sidecar_ready'

              echo "waiting for sidecar UNIX pipe at $pipe..."
              until [ -f "$ready_flag" ] && [ -p "$pipe" ]; do
                sleep 1
              done

              echo "Getting backup from sidecar..."

              # Use the pipe as path arg for the exporter 
              python3 -m src.exporter --pvc "{{ PVC_NAME }}" --path "$pipe"
          resources:
            requests:
              cpu: "250m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          volumeMounts:
            - name: shared
              mountPath: /shared
          env:
            - name: STORAGE_ADDRESS
              value: "templated"
            - name: STORAGE_USERNAME
              value: "templated"
            - name: STORAGE_PASSWORD
              value: "templated"
            - name: CLUSTER_NAME
              value: "templated"
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: PGHOST
              value: "127.0.0.1"
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              value: "postgres"

        # --- SIDE CAR CONTAINER: Target production database providing version-matched binaries ---
        - name: postgres-engine-provider
          image: "{{ POSTGRES_IMAGE }}" # Get the real used image used
          command: ["/bin/sh", "-c"]
          args:
            - |
              # This script create a UNIX pipe to share the PostgreSQL binaries
              pipe='/shared/pg_pipe'
              ready_flag='/shared/sidecar_ready'

              rm -f "$pipe" "$ready_flag"
              mkfifo "$pipe"
              
              if [ -p "$pipe" ]; then
                echo "sucessfully created UNIX pipe at $pipe"
              else
                echo 'error: UNIX pipe not created, cannot get pg binaries'
                exit 1
              fi
              
              # Simple flag to be sure the sidecar is running before the main container
              echo '' > "$ready_flag"
              if [ -f "$ready_flag" ]; then
                echo "successfully created sidecar ready-flag"
              else
                echo 'error: sidecar ready-flag not created, cannot continue'
                exit 1
              fi
 
              echo "Sidecar bootstrap finished, flag created."

              # Simple data dump to the pipe
              echo "starting database dump to UNIX pipe..."
              pg_dump > "$pipe"

              rm -f "$ready_flag"
          volumeMounts:
            - name: volume-to-backup
              mountPath: "{{ MOUNTED_PATH }}"
              readOnly: true
            - name: shared
              mountPath: /shared
          env:
            - name: PGHOST
              value: "127.0.0.1"
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              value: "postgres"
      volumes:
        - name: volume-to-backup
          persistentVolumeClaim:
            claimName: "{{ PVC_NAME }}"
        - name: shared
          emptyDir: {} # Shared space where to find pg_dump