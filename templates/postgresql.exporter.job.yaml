# ----- ARCHITECTURE -----
# database (running psql instance) --> database-dumper (pg_dump) --UNIX pipe-> Python exporter
# ------------------------

apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ JOB_NAME }}"
  namespace: "{{ NAMESPACE }}"
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets: {{ ALL_IMAGE_PULL_SECRETS | tojson }}
      containers:
        # --- MAIN CONTAINER: exporter.py ---
        - name: exporter
          image: "{{ BKUP_IMAGE_REPOSITORY }}:{{ BKUP_IMAGE_TAG }}"
          imagePullPolicy: {{ BKUP_IMAGE_PULL_POLICY }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              # This script waits for a UNIX pipe from the sidecar container (this is to use the right PostgreSQL binaries)
              pipe="$BKUP_MOUNT_PATH/pg_pipe"

              echo "waiting for sidecar UNIX pipe at $pipe..."
              timer=1
              until [ -p "$pipe" ]; do
                sleep $timer
                timer=$(($timer+1))
                echo "waited $timer"
              done

              echo "Getting backup from database-dumper..."

              # Use the pipe as path arg for the exporter 
              python3 -m src.exporter
          resources:
            requests:
              cpu: "250m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          volumeMounts:
            - name: shared
              mountPath: {{ MOUNT_PATH }}
          env:
            - name: BKUP_STORAGE_PROTOCOL
              value: {{ STORAGE_PROTOCOL }}
            - name: BKUP_STORAGE_ENDPOINT
              value: {{ STORAGE_ENDPOINT }}
            - name: BKUP_STORAGE_ROOT
              value: {{ STORAGE_ROOT }}
            - name: BKUP_STORAGE_USERNAME
              value: {{ STORAGE_USERNAME }}
            - name: BKUP_STORAGE_PASSWORD
              value: {{ STORAGE_PASSWORD }}
            - name: BKUP_ARCHIVE_NAME
              value: {{ ARCHIVE_NAME }}
            - name: BKUP_MOUNT_PATH
              value: {{ MOUNT_PATH }}


        # --- SIDECAR CONTAINER: Dump the database (with real PostgreSQL binaries) ---
        - name: database-dumper
          image: "{{ POSTGRESQL_IMAGE_REPOSITORY }}:{{ POSTGRESQL_IMAGE_TAG }}"
          imagePullPolicy: {{ POSTGRESQL_IMAGE_PULL_POLICY }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              # This script create a UNIX pipe to send data to the exporter


              # -------------------------------------------
              #  UNIX PIPE TO SEND DATA TO THE WORKER
              # -------------------------------------------
              pipe="$BKUP_MOUNT_PATH/pg_pipe"
              rm -f "$pipe"

              mkfifo "$pipe"
              if [ -p "$pipe" ]; then
                echo "successfully created UNIX pipe at $pipe"
              else
                echo 'error: UNIX pipe not created, cannot synchronize with the exporter container'
                exit 1
              fi


              # -------------------------------------------
              #  DATA DUMP
              # -------------------------------------------
              if [ -z "$PGHOST" ]; then
                echo "error: PGHOST environment variable is missing."
                exit 1
              fi

              if [ -z "$PGPORT" ]; then
                echo "error: PGPORT environment variable is missing."
                exit 1
              fi

              if [ -z "$PGUSER" ]; then
                echo "error: PGUSER environment variable is missing."
                exit 1
              fi

              if [ -z "$PGPASSWORD" ]; then
                echo "error: PGPASSWORD environment variable is missing."
                exit 1
              fi

              TARGET_HOST="$PGHOST"
              TARGET_PORT="$PGPORT"
              TARGET_USER="$PGUSER"

              # If PGPASSWORD points to a mounted secret file, read file content
              if [ -f "$PGPASSWORD" ]; then
                PGPASSWORD=$(cat "$PGPASSWORD")
              fi

              echo "Waiting for remote PostgreSQL at $TARGET_HOST:$TARGET_PORT as user $TARGET_USER..."
              until pg_isready -h "$TARGET_HOST" -p "$TARGET_PORT" -U "$TARGET_USER" >/dev/null 2>&1; do
                echo "Waiting for database connection..."
                sleep 2
              done
              

              # List databases
              if [ -n "$PGDATABASE" ]; then
                db_list="$PGDATABASE"
              else
                db_list=$(psql -h "$TARGET_HOST" -p "$TARGET_PORT" -U "$TARGET_USER" -t -A -c "SELECT datname FROM pg_database WHERE datistemplate = false AND datname != 'postgres'" 2>/dev/null)
              fi

              if [ -z "$db_list" ]; then
                echo "error: no database found or access denied for user '$TARGET_USER'"
                exit 1
              fi

              echo "starting database(s) dump to UNIX pipe..."
              for db in $db_list; do

                # Dump data to pipe
                pg_dump -h "$TARGET_HOST" -p "$TARGET_PORT" -U "$TARGET_USER" -d "$db" > "$pipe"
                dump_exit=$?

                if [ $dump_exit -ne 0 ]; then
                  echo "error: pg_dump failed with exit code $dump_exit for database '$db'"
                  exit 1
                fi
              done

          volumeMounts:
            - name: shared
              mountPath: {{ MOUNT_PATH }}
          env:
            - name: BKUP_MOUNT_PATH
              value: {{ MOUNT_PATH }}

      volumes:
        - name: shared
          emptyDir: {} # Shared space between all containers
