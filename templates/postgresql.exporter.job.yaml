# ----- ARCHITECTURE -----
# database (running psql instance) <-- database-dumper (containing pg_dump) --UNIX pipe-> Python exporter
# ------------------------

apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ JOB_NAME }}"
  namespace: "{{ JOB_NAMESPACE }}"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 86400
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets: {{ ALL_IMAGE_PULL_SECRETS | tojson }}
      containers:
        # --- MAIN CONTAINER: exporter.py ---
        - name: exporter
          image: "{{ BKUP_IMAGE_REPOSITORY }}:{{ BKUP_IMAGE_TAG }}"
          imagePullPolicy: "{{ BKUP_IMAGE_PULL_POLICY }}"
          securityContext: {{ BKUP_SECURITY_CONTEXT | tojson }}
          command: ["python", "-m", "src.exporter"]
          resources:
            requests:
              cpu: "250m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          volumeMounts:
            - name: shared
              mountPath: "{{ MOUNT_PATH }}"
            - name: tmp
              mountPath: /tmp
          env:
            - name: BKUP_STORAGE_PROTOCOL
              value: "{{ STORAGE_PROTOCOL }}"
            - name: BKUP_STORAGE_ENDPOINT
              value: "{{ STORAGE_ENDPOINT }}"
            - name: BKUP_STORAGE_ROOT
              value: "{{ STORAGE_ROOT }}"
            - name: BKUP_STORAGE_USERNAME
              value: "{{ STORAGE_USERNAME }}"
            - name: BKUP_STORAGE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "{{ STORAGE_PASSWORD_SECRET_NAME }}"
                  key: "{{ STORAGE_PASSWORD_SECRET_KEY }}"
            - name: BKUP_ARCHIVE_NAME
              value: "{{ ARCHIVE_NAME }}"
            - name: BKUP_MOUNT_PATH
              value: "{{ MOUNT_PATH }}"
            - name: BKUP_JOB_NAMESPACE
              value: "{{ JOB_NAMESPACE }}"
            - name: BKUP_WAIT_PIPE
              value: "true"

        # --- SIDECAR CONTAINER: Dump the database (with real PostgreSQL binaries) ---
        - name: database-dumper
          image: "{{ POSTGRESQL_IMAGE_REPOSITORY }}:{{ POSTGRESQL_IMAGE_TAG }}"
          imagePullPolicy: "{{ POSTGRESQL_IMAGE_PULL_POLICY }}"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command: ["/bin/sh", "-c"]
          args:
            - |
              # ------------------------------------------------------
              # Signal is a file used to communicate with the exporter
              # ------------------------------------------------------
              signal="$BKUP_MOUNT_PATH/signal"
              rm -f "$signal"

              # Usage: get_signal
              get_signal() {
                if [ -f "$signal" ]; then
                  cat "$signal"
                fi
              }

              # Usage: set_signal <signal_str>
              set_signal() {
                echo $1 > "$signal"
              }

              set_signal 'starting'


              # ------------------------------------------------------
              # Pipe is used to stream data to the exporter
              # ------------------------------------------------------
              pipe="$BKUP_MOUNT_PATH/pipe"
              rm -f "$pipe"

              mkfifo "$pipe"
              if [ -p "$pipe" ]; then
                echo "successfully created UNIX pipe at $pipe"
              else
                echo 'error: UNIX pipe not created, cannot synchronize with the exporter container'
                exit 1
              fi


              # ------------------------------------------------------
              # Retrieve databases informations & test access
              # ------------------------------------------------------
              if [ -z "$PGHOST" ]; then
                echo "error: PGHOST environment variable is missing."
                exit 1
              fi

              if [ -z "$PGPORT" ]; then
                echo "error: PGPORT environment variable is missing."
                exit 1
              fi

              if [ -z "$PGUSER" ]; then
                echo "error: PGUSER environment variable is missing."
                exit 1
              fi

              if [ -z "$PGPASSWORD" ]; then
                echo "error: PGPASSWORD environment variable is missing."
                exit 1
              fi

              # If PGPASSWORD points to a mounted secret file, read file content
              if [ -f "$PGPASSWORD" ]; then
                export PGPASSWORD=$(cat "$PGPASSWORD")
              fi

              timer=1
              until pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" >/dev/null 2>&1; do
                sleep $timer
                timer=$(($timer+1))
                echo "waiting for PostgreSQL connection at $PGHOST:$PGPORT as user $PGUSER... $timer"
              done

              # List databases
              if [ -z "$PGDATABASE" ] || [ "$PGDATABASE" = 'None' ]; then
                # Ensure not falling in 'FATAL: database "None" does not exist'
                unset PGDATABASE

                # Default is all databases
                db_list=$(psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -t -A -c "SELECT datname FROM pg_database WHERE datistemplate = false" 2>/dev/null)
              else
                # User-defined database
                db_list=$PGDATABASE
              fi

              if [ -z "$db_list" ]; then
                echo "error: no database found"
                exit 1
              fi


              # ------------------------------------------------------
              # Dump each databases & stream them through the pipe to the exporter
              # ------------------------------------------------------
              echo "starting database(s) dump to $pipe..."
              for db in $db_list; do
                echo "dumping database '$db'..."

                set_signal "dumping:$db"

                # Dump data to pipe (--clean --if-exists is to add instructions in dump file, used at the moment of the restoration)
                pg_dump -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$db" --clean --if-exists > "$pipe"
                psql_exit=$?
                if [ $psql_exit -ne 0 ]; then
                  echo "error: pg_dump failed with exit code $psql_exit for database '$db'"
                  exit 1
                fi

                until [ "$(get_signal)" = "done:$db" ]; do
                  sleep 1
                done

                echo "success: database '$db' exported"
              done

              set_signal 'finished'

              exit 0
          volumeMounts:
            - name: shared
              mountPath: "{{ MOUNT_PATH }}"
            - name: tmp
              mountPath: /tmp
          env:
            - name: BKUP_MOUNT_PATH
              value: "{{ MOUNT_PATH }}"
            - name: PGHOST
              value: "{{ POSTGRESQL_HOST }}"
            - name: PGPORT
              value: "{{ POSTGRESQL_PORT }}"
            - name: PGDATABASE
              value: "{{ POSTGRESQL_DATABASE }}"
            - name: PGUSER
              value: "{{ POSTGRESQL_USERNAME }}"
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: "{{ POSTGRESQL_PASSWORD_SECRET_NAME }}"
                  key: "{{ POSTGRESQL_PASSWORD_SECRET_KEY }}"

      volumes:
        - name: shared
          emptyDir: {} # Shared space between all containers
        - name: tmp
          emptyDir: {}
