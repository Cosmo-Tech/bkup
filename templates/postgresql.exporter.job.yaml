apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ JOB_NAME }}"
  namespace: "{{ NAMESPACE }}"
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - "{{ NODE_NAME }}"
      containers:
        # --- MAIN CONTAINER: Clustersnap core tool with native Python environment ---
        - name: postgres-backup-worker
          image: ghcr.io/cosmo-tech/clustersnap:latest
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              # 1. Wait until the sidecar copies the native binaries and starts the database engine
              until [ -f /mnt/bin/pg_dump ] && psql -h 127.0.0.1 -U postgres -lqt 2>/dev/null; do
                echo "Waiting for native binaries and local database engine to become ready..."
                sleep 2
              done
              
              # 2. Prepend the shared binary directory to PATH so Python can discover them natively
              export PATH="/mnt/bin:$PATH"
              
              # 3. Execute the dedicated worker process with clean structured imports
              python3 -m src.job_postgresql_worker --pvc "{{ PVC_NAME }}"
          resources:
            requests:
              cpu: "250m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          volumeMounts:
            - name: shared-binaries
              mountPath: /mnt/bin
          env:
            - name: STORAGE_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: clustersnap-config
                  key: storage-address
            - name: STORAGE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: clustersnap-config
                  key: storage-username
            - name: STORAGE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clustersnap-config
                  key: storage-password
            - name: CLUSTER_NAME
              valueFrom:
                secretKeyRef:
                  name: clustersnap-config
                  key: cluster-name
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: PGHOST
              value: "127.0.0.1"

        # --- SIDE CAR CONTAINER: Target production database providing version-matched binaries ---
        - name: postgres-engine-provider
          image: "{{ POSTGRES_IMAGE }}" # Dynamic image matching production layout (e.g. Bitnami, Official)
          command: ["/bin/sh", "-c"]
          args:
            - |
              # 1. Locate and copy the version-matched database binaries to the shared directory
              PG_BIN_DIR=$(dirname $(which pg_dump))
              cp $PG_BIN_DIR/pg_dump /mnt/bin/
              cp $PG_BIN_DIR/pg_dumpall /mnt/bin/
              cp $PG_BIN_DIR/psql /mnt/bin/
              
              # 2. Copy shared libraries if present (critical for hardened/minimal images compatibility)
              cp /usr/lib/libpq.so* /mnt/bin/ 2>/dev/null || true
              cp /opt/bitnami/postgresql/lib/libpq.so* /mnt/bin/ 2>/dev/null || true
              
              # 3. Initialize a temporary configuration with network trust mode over loopback
              mkdir -p /tmp/pg_config
              cp "{{ MOUNTED_PATH }}/pg_hba.conf" /tmp/pg_config/pg_hba.conf 2>/dev/null || true
              echo "host all all 127.0.0.1/32 trust" > /tmp/pg_config/pg_hba_custom.conf
              cat /tmp/pg_config/pg_hba.conf >> /tmp/pg_config/pg_hba_custom.conf 2>/dev/null || true
              
              # 4. Start the database engine bound strictly to localhost (127.0.0.1)
              exec docker-entrypoint.sh post²gres \
                -c hba_file=/tmp/pg_config/pg_hba_custom.conf \
                -c listen_addresses='127.0.0.1' \
                -c external_pid_file='/tmp/postmaster.pid'
          volumeMounts:
            - name: volume-to-backup
              mountPath: "{{ MOUNTED_PATH }}"
              readOnly: true # Absolute read-only compliance for production snapshot preservation
            - name: shared-binaries
              mountPath: /mnt/bin
      volumes:
        - name: volume-to-backup
          persistentVolumeClaim:
            claimName: "{{ PVC_NAME }}"
        - name: shared-binaries
          emptyDir: {} # Ephemeral scratchpad wiped immediately when the Job object is reaped