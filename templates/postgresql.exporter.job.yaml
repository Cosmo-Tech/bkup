apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ JOB_NAME }}"
  namespace: "{{ NAMESPACE }}"
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
        # --- MAIN CONTAINER: Clustersnap core tool with native Python environment ---
        - name: postgres-backup-worker
          image: ghcr.io/cosmo-tech/clustersnap:latest
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              # 1. Wait until the sidecar copies the native binaries and starts the database engine
              until [ -f /clustersnap/pg_dump ] && psql -h 127.0.0.1 -U postgres -lqt 2>/dev/null; do
                echo "Waiting for native binaries and local database engine to become ready..."
                sleep 2
              done
              
              # 2. Prepend the shared binary directory to PATH so Python can discover them natively
              export PATH="/clustersnap:$PATH"
              
              # 3. Execute the dedicated worker process with clean structured imports
              python3 -m src.job_postgresql_worker --pvc "{{ PVC_NAME }}"
          resources:
            requests:
              cpu: "250m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          volumeMounts:
            - name: shared-binaries
              mountPath: /clustersnap
          env:
            - name: STORAGE_ADDRESS
              value: "templated"
            - name: STORAGE_USERNAME
              value: "templated"
            - name: STORAGE_PASSWORD
              value: "templated"
            - name: CLUSTER_NAME
              value: "templated"
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: PGHOST
              value: "127.0.0.1"

        # --- SIDE CAR CONTAINER: Target production database providing version-matched binaries ---
        - name: postgres-engine-provider
          image: "{{ POSTGRES_IMAGE }}" # Get the real used image used
          command: ["/bin/sh", "-c"]
          args:
            - |
              # 1. Dynamically locate PostgreSQL binaries using standard system environment pathing
              PG_DUMP_BIN=$(which pg_dump)
              PG_DUMPALL_BIN=$(which pg_dumpall)
              PSQL_BIN=$(which psql)

              # 2. Copy extracted native binaries directly to the shared isolated workspace
              cp "$PG_DUMP_BIN" /clustersnap/pg_dump
              cp "$PG_DUMPALL_BIN" /clustersnap/pg_dumpall
              cp "$PSQL_BIN" /clustersnap/psql

              # 3. Dynamic Shared Libraries Extraction (Pure POSIX + Multi-OS Support)
              # Multi-libc fallback tracking for both Debian/Ubuntu (glibc) and Alpine (musl)
              cp /usr/lib/libpq.so* /clustersnap/ 2>/dev/null || true
              cp /lib/libpq.so* /clustersnap/ 2>/dev/null || true
              
              # Standard path scan based on the binary origin folder
              PG_BIN_DIR=$(dirname "$PG_DUMP_BIN")
              cp "$PG_BIN_DIR/../lib/libpq.so"* /clustersnap/ 2>/dev/null || true

              # POSIX-compliant method to process ldd output if present
              if which ldd >/dev/null 2>&1; then
                for item in $(ldd "$PG_DUMP_BIN" 2>/dev/null); do
                  case "$item" in
                    /*)
                      if [ -f "$item" ]; then
                        cp "$item" /clustersnap/ 2>/dev/null || true
                      fi
                      ;;
                  esac
                done
              fi

              # 4. Define target data directory directly from the backup-map mounted path
              TARGET_DIR="{{ MOUNTED_PATH }}"
              if [ -f "{{ MOUNTED_PATH }}/data/postgresql.conf" ]; then
                TARGET_DIR="{{ MOUNTED_PATH }}/data"
              elif [ -f "{{ MOUNTED_PATH }}/postgresql/postgresql.conf" ]; then
                TARGET_DIR="{{ MOUNTED_PATH }}/postgresql"
              fi

              # 5. Initialize a temporary configuration with network trust mode over loopback
              mkdir -p /tmp/pg_config
              cp "$TARGET_DIR/pg_hba.conf" /tmp/pg_config/pg_hba.conf 2>/dev/null || true
              echo "host all all 127.0.0.1/32 trust" > /tmp/pg_config/pg_hba_custom.conf
              cat /tmp/pg_config/pg_hba.conf >> /tmp/pg_config/pg_hba_custom.conf 2>/dev/null || true

              # 6. Start the database engine safely over localized sockets and trusted network loopback
              exec postgres \
                -D "$TARGET_DIR" \
                -c hba_file=/tmp/pg_config/pg_hba_custom.conf \
                -c listen_addresses='127.0.0.1' \
                -c unix_socket_directories='/tmp' \
                -c external_pid_file='/tmp/postmaster.pid'
          volumeMounts:
            - name: volume-to-backup
              mountPath: "{{ MOUNTED_PATH }}"
              readOnly: true
            - name: shared-binaries
              mountPath: /clustersnap
      volumes:
        - name: volume-to-backup
          persistentVolumeClaim:
            claimName: "{{ PVC_NAME }}"
        - name: shared-binaries
          emptyDir: {} # Shared space where to find pg_dump