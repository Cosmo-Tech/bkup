# ----- ARCHITECTURE -----
# database (running psql instance) --> database-dumper (pg_dump) --> [UNIX pipe] --> worker (python code to transfer data to remote storage)
# ------------------------

apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ JOB_NAME }}"
  namespace: "{{ NAMESPACE }}"
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never    
      containers:
        # --- MAIN CONTAINER: Clustersnap core tool with native Python environment ---
        - name: worker
          image: ghcr.io/cosmo-tech/clustersnap:latest
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              # This script waits for a UNIX pipe from the sidecar container (this is to to use the right PostgreSQL binaries)
              pipe='/shared/pg_pipe'

              echo "waiting for sidecar UNIX pipe at $pipe..."
              timer=1
              until [ -p "$pipe" ]; do
                sleep $timer
                timer=$(($timer+1))
                echo "waited $timer"
              done

              echo "Getting backup from sidecar..."

              # Use the pipe as path arg for the exporter 
              python3 -m src.exporter --pvc "{{ PVC_NAME }}" --path "$pipe"

              sleep 11111111111111
          resources:
            requests:
              cpu: "250m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          volumeMounts:
            - name: shared
              mountPath: /shared
          env:
            - name: STORAGE_ADDRESS
              value: "templated"
            - name: STORAGE_USERNAME
              value: "templated"
            - name: STORAGE_PASSWORD
              value: "templated"
            - name: CLUSTER_NAME
              value: "templated"
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

        # --- SIDECAR CONTAINER #2: Dump the database (with the original image binaries) ---
        - name: database-dumper
          image: "{{ POSTGRES_IMAGE }}" # Get the real used image used
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -x
              # This script create a UNIX pipe to talk with the worker

              pipe='/shared/pg_pipe'
              current_db='/shared/current_db'

              rm -f "$pipe" "$ready_flag" "$current_db"



              # -------------------------------------------
              #  UNIX PIPE TO SEND DATA TO THE WORKER
              # -------------------------------------------

              # Create UNIX pipe to talk with the worker
              mkfifo "$pipe"
              if [ -p "$pipe" ]; then
                echo "sucessfully created UNIX pipe at $pipe"
              else
                echo 'error: UNIX pipe not created, cannot get pg binaries'
                exit 1
              fi



              # -------------------------------------------
              #  DATA DUMP
              # -------------------------------------------

                # Target Postgres host resolution from environment variable
              TARGET_HOST="${PGHOST:-$POSTGRES_HOST}"
              TARGET_PORT="${PGPORT:-5432}"

              echo "Waiting for remote PostgreSQL at $TARGET_HOST:$TARGET_PORT..."
              until pg_isready -h "$TARGET_HOST" -p "$TARGET_PORT" >/dev/null 2>&1; do
                sleep 2
                echo "Waiting for database connection..."
              done

              # Discover user if PGUSER is not preset
              TARGET_USER="${PGUSER:-postgres}"
              

              # List all databases
              db_list=$(psql -h "$TARGET_HOST" -p "$TARGET_PORT" -U "$TARGET_USER" -t -A -c "SELECT datname FROM pg_database WHERE datistemplate = false AND datname != 'postgres'")

              echo "starting database(s) dump to UNIX pipe..."
              for db in $db_list; do
                echo "$db" > "$current_db"

                # Dump data to pipe
                pg_dump -h "$TARGET_HOST" -p "$TARGET_PORT" -U "$TARGET_USER" -d "$db" > "$pipe"

                # Ensure dump is consumed by worker
                while [ -s "$current_db" ]; do
                  sleep 1
                done
              done

              # "done" is the signal for that Python is waiting in the worker
              echo "done" > "$current_db"


              sleep 11111111111111
          volumeMounts:
            - name: shared
              mountPath: /shared
          env:
{{ ORIGINAL_ENV_BLOCK }}
      volumes:
        - name: shared
          emptyDir: {} # Shared space between all containers
