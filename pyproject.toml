[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "bkup"
version = "0.0.0"
description = "Cloud-Agnostic Kubernetes Backup Tool"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "kubernetes",
    "azure-identity",
    "azure-storage-blob",
    "pydantic",
    "psutil",
    "PyYAML",
]


[project.scripts]
bkup = "src.master:main"


[tool.ruff]
line-length = 120
exclude = [ ".git", ".venv", "__pycache__" ]


[tool.ruff.lint]
select = [ "E", "F", "W" ]
ignore = [ "E501" ] # ignore too long lines
