[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[project]
name = "bkup"
version = "0.0.0"
description = "Cloud-Agnostic Kubernetes Backup Tool"
readme = "README.md"
license = "MIT"
requires-python = ">=3.15"
dependencies = [
    "kubernetes",
    "psutil",
    "PyYAML",
    "jinja2",
    "fsspec>=2024.2.0,<2025.0.0",
    "adlfs>=2024.2.0,<2025.0.0",
    "s3fs>=2024.2.0,<2025.0.0",
    "gcsfs>=2024.2.0,<2025.0.0",
    "aiobotocore>=2.11.0,<3.0.0",
    "InquirerPy"
]


[project.scripts]
bkup = "src.cli:main"


[tool.setuptools.packages.find]
where = ["."]


[tool.ruff]
line-length = 180
exclude = [ ".git", ".venv", "__pycache__" ]


[tool.ruff.lint]
select = [ "E", "F", "W" ]
ignore = [ 
    "E501", # ignore too long lines
    "W293"  # ignore blank lines
]


[tool.ruff.format]
indent-style = "space"
line-ending = "lf"
